# -----------------------------------------------------------
# Per-project Docker Compose for airbnb
# Deployed to /opt/airbnb/
# -----------------------------------------------------------
services:
  # -----------------------------------------------------------
  # PostgreSQL
  # -----------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airbnb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airbnb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No port binding - accessed via docker network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airbnb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Next.js Application
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "binaries.prisma.sh=104.20.43.103"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-airbnb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-airbnb}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default
      - shared-proxy  # Connect to shared nginx reverse proxy

# Connect to shared nginx network (created by /opt/shared/docker-compose.yml)
networks:
  shared-proxy:
    external: true

volumes:
  postgres_data:
  uploads_data:
