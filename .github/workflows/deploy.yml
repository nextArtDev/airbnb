name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # -----------------------------------------------------------
  # 1. Lint & Typecheck
  # -----------------------------------------------------------
  checks:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  # -----------------------------------------------------------
  # 2. Deploy to VPS (only on push to main, after checks pass)
  # -----------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            DEPLOY_DIR="/opt/airbnb"
            echo "=== Pulling latest code ==="
            cd "$DEPLOY_DIR"
            git pull origin main

            echo "=== Running migrations ==="
            docker compose exec -T app bunx prisma migrate deploy

            echo "=== Rebuilding and restarting ==="
            docker compose build --no-cache app
            docker compose up -d --force-recreate app

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Waiting for health check ==="
            for i in $(seq 1 30); do
              if docker compose exec -T app bun -e "fetch('http://localhost:3000').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))" 2>/dev/null; then
                echo "=== App is healthy ==="
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "=== Health check failed ==="
            docker compose logs app --tail=50
            exit 1
